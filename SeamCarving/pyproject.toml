[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seamcarving"
version = "1.0.0"
description = "Content-aware image resizing with seam carving (C++ core + Python GUI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "Pillow>=9.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest", "pybind11>=2.11"]

[project.gui-scripts]
seamcarving-gui = "seamcarving.gui:main"

[project.scripts]
seamcarving-cli = "seamcarving.cli:main"